<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Writing Studio</title>
    <script>
      // Set the theme before first paint. Light is the default on a first visit, even on a dark OS.
      try {
        var t = localStorage.getItem('studio.theme');
        var r = t === 'dark' ? 'dark' : t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : 'light';
        document.documentElement.setAttribute('data-theme', r);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
